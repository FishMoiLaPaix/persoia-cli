    <p>Cet assistant va installer <strong>PersoIA CLI</strong> dans
    <code>/usr/local/bin/persoia</code>.</p>

    <p>Après l'installation, ouvrez un nouveau terminal et lancez&nbsp;:</p>
    <pre>persoia login
persoia version</pre>

    <p style="color:#666;">PersoIA CLI — assistant code souverain.
    Mises à jour&nbsp;: réinstallez le dernier <code>.pkg</code> ou utilisez
    Homebrew (<code>brew upgrade persoia</code>).</p>
</body>
